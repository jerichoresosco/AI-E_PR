# conda env create -f environment.yml  &&  conda activate aiepr
# Tested with Python 3.11 and the versions below (the newest at the time).
name: aiepr
channels:
  - conda-forge
dependencies:
  - python>=3.11
  - numpy>=2.4
  - pandas>=3.0
  - scipy>=1.17
  - matplotlib>=3.10
  - pyarrow>=23
  - libpysal>=4.14
  - esda>=2.9
